<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="TUOBA — نظام تشغيل مطاعم متكامل: POS، KDS، مالية، HR، كول سنتر، مدفوعات — بواجهة عربية وأربعة لغات إضافية." />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon.ico" sizes="any" />
  <link rel="icon" href="icons/favicon.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <title>TUOBA — نظام تشغيل المطاعم المتكامل</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <h1 id="app-title">TUOBA Restaurant OS</h1>
        <p id="app-subtitle"></p>
      </div>
      <div class="toolbar">
        <select id="brand-select" class="select compact"></select>
        <select id="branch-select" class="select compact"></select>
      </div>
      <div class="toolbar">
        <select id="lang-select" class="select compact"></select>
        <button class="btn soft" id="export-btn">تصدير</button>
      </div>
      <div class="toolbar">
        <button class="btn soft" id="passkey-btn">Passkey</button>
        <button class="btn soft" id="location-btn">الموقع</button>
      </div>
      <div class="toolbar single">
        <button class="btn mini danger-ghost" id="reset-btn">مسح البيانات</button>
      </div>
    </header>

    <main id="content" class="content"></main>

    <nav class="bottom-nav" aria-label="main navigation">
      <button data-tab="overview" class="nav-btn"><span class="ic"></span><span class="lb"></span></button>
      <button data-tab="pos" class="nav-btn"><span class="ic"></span><span class="lb"></span></button>
      <button data-tab="orders" class="nav-btn"><span class="ic"></span><span class="lb"></span></button>
      <button data-tab="kds" class="nav-btn"><span class="ic"></span><span class="lb"></span></button>
      <button data-tab="pickup" class="nav-btn"><span class="ic"></span><span class="lb"></span></button>
      <button data-tab="apps" class="nav-btn"><span class="ic"></span><span class="lb"></span></button>
      <button data-tab="printing" class="nav-btn"><span class="ic"></span><span class="lb"></span></button>
      <button data-tab="expenses" class="nav-btn"><span class="ic"></span><span class="lb"></span></button>
      <button data-tab="recipe" class="nav-btn"><span class="ic"></span><span class="lb"></span></button>
      <button data-tab="geidea" class="nav-btn"><span class="ic"></span><span class="lb"></span></button>
      <button data-tab="finance" class="nav-btn"><span class="ic"></span><span class="lb"></span></button>
      <button data-tab="callcenter" class="nav-btn"><span class="ic"></span><span class="lb"></span></button>
      <button data-tab="crm" class="nav-btn"><span class="ic"></span><span class="lb"></span></button>
      <button data-tab="attendance" class="nav-btn"><span class="ic"></span><span class="lb"></span></button>
      <button data-tab="payments" class="nav-btn"><span class="ic"></span><span class="lb"></span></button>
      <button data-tab="security" class="nav-btn"><span class="ic"></span><span class="lb"></span></button>
      <button data-tab="reports" class="nav-btn"><span class="ic"></span><span class="lb"></span></button>
    </nav>
  </div>
  <script src="js/i18n.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
